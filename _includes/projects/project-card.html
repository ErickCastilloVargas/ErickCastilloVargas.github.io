<a href="{{ project_url }}" class="listing-card project-card wow animated fadeInUp" data-wow-delay=".15s" {%- if external and site.open_new_tab %} target="_blank" rel="noopener"{%- endif %}>
  {%- if project_img %}
  <div class="project-card__media">
    <img id="{{ project_id }}-img" src="{{ project_img | relative_url }}" alt="{{ project_name }}" loading="lazy" />
  </div>
  {%- endif %}

  <div class="listing-card__body">
    {%- if project_tools.size > 0 %}
    <div class="listing-card__meta" id="{{ project_id }}-tools">
      {%- for tool in project_tools -%}
      <span class="listing-pill">{{ tool }}</span>
      {%- endfor -%}
    </div>
    {%- endif %}

    <h3 id="{{ project_id }}-name" class="listing-card__title">{{ project_name }}</h3>
    <p id="{{ project_id }}-desc" class="listing-card__desc">{{ project_desc }}</p>

    <div class="listing-card__footer">
      <span class="listing-card__cta">
        {%- if project_url contains 'github.com' -%}
        <i class="fab fa-github"></i> View on GitHub <i class="fas fa-arrow-right"></i>
        {%- else -%}
        View project <i class="fas fa-arrow-right"></i>
        {%- endif -%}
      </span>
    </div>
  </div>
</a>
