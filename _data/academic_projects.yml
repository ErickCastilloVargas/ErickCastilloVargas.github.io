- title: Master's Thesis. Epigenome-wide association study of the upper airway microbiome related to inhaled corticosteroids response
  university: Universidad de La Laguna, Spain
  from: SEP 2025
  to: JUL 2026
  description: Performed microbiome epigenome-wide association studies integrating blood DNA methylation and upper-airway microbiome data from asthma patients to identify epigenetic markers associated with the respiratory microbiome previously linked to inhaled corticosteroid treatment response.

- title: "Master's Thesis. MSK1 as a potential regulator of perineuronal net maturation in parvalbumin interneurons: a study in an Msk1 KO mouse model"
  university: Instituto de Neurociencias de Castilla y León, Spain
  from: NOV 2023
  to: JUL 2024
  description: Investigated the role of MSK1 (mitogen- and stress-activated kinase 1) in the maturation of perineuronal nets, analyzing gene expression and structural development in MSK1 knockout mice compared to wild-type controls. Developed a preliminary deep learning model for image analysis, enabling detailed segmentation of perineuronal nets in individual parvalbumin-expressing interneurons.

- title: Bachelor's Thesis. Studying the effects of point mutations in the mouse Tardbp gene and their relationship with motor neuron degeneration
  university: Hospital Universitario de Canarias, Spain
  from: APR 2023
  to: JUL 2023
  description: Investigated the role of TDP-43 (TAR DNA-binding protein 43) in a murine model of amyotrophic lateral sclerosis, analyzing neuronal morphology and evaluating protein dysfunction.
